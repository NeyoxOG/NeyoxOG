<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Luna das Lamm 🐑</title>
  <meta name="theme-color" content="#1c1427" />
  <style>
    :root{
      --bg1:#140f1f;
      --bg2:#23162f;
      --glass: rgba(255,255,255,.08);
      --glass-strong: rgba(255,255,255,.16);
      --line: rgba(255,255,255,.18);
      --text:#f7f5ff;
      --muted: rgba(247,245,255,.65);
      --accent:#ffd6e7;
      --accent2:#ff9ec8;
      --good:#35d07f;
      --bad:#ff7b7b;
      --shadow: 0 18px 50px rgba(0,0,0,.45);
      --ease: cubic-bezier(.2,.8,.2,1);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: "SF Pro Display", "SF Pro Text", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background:
        radial-gradient(900px 600px at 20% 20%, rgba(255,214,231,.18), transparent 60%),
        radial-gradient(900px 600px at 80% 10%, rgba(255,158,200,.18), transparent 60%),
        radial-gradient(900px 600px at 50% 85%, rgba(164,137,255,.18), transparent 60%),
        linear-gradient(140deg, var(--bg1), var(--bg2));
      overflow:hidden;
      line-height:1.5;
    }

    body:before{
      content:"";
      position:fixed; inset:0;
      pointer-events:none;
      opacity:.08;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/></filter><rect width="160" height="160" filter="url(%23n)" opacity=".25"/></svg>');
      mix-blend-mode: overlay;
    }

    .wrap{height:100%; display:flex; flex-direction:column; padding:14px 14px 24px; gap:12px;}

    .topbar{display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-radius:18px; background:rgba(255,255,255,.06); border:1px solid var(--line); backdrop-filter: blur(12px); box-shadow: var(--shadow);} 
    .topbar .title{display:flex; align-items:center; gap:10px;}
    .logo{width:40px; height:40px; border-radius:14px; background:linear-gradient(135deg, var(--accent), var(--accent2)); display:grid; place-items:center; font-size:20px; box-shadow:0 12px 30px rgba(255,214,231,.3);} 
    .topbar h1{margin:0; font-size:16px;}
    .topbar p{margin:0; font-size:12px; color:var(--muted);} 

    .info{display:grid; gap:10px;}
    .pill-row{display:flex; gap:8px; flex-wrap:wrap;}
    .pill{padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.08); font-size:12px; color:var(--muted);} 

    .card{border-radius:20px; border:1px solid var(--line); background:rgba(255,255,255,.06); padding:12px; backdrop-filter: blur(10px); box-shadow: var(--shadow);} 
    .stats{display:grid; gap:8px;} 
    .stat{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12px;} 
    .bar{height:8px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); overflow:hidden; flex:1;} 
    .bar span{display:block; height:100%; width:50%; background:linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s var(--ease);} 

    .pet-area{flex:1; display:grid; place-items:center; position:relative;}
    .pet-stage{width:min(320px, 80vw); aspect-ratio:3/4; border-radius:26px; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.25); position:relative; overflow:hidden; box-shadow: var(--shadow);} 
    .pet-stage:before{content:""; position:absolute; inset:0; background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.15), transparent 60%);} 

    .pet{
      position:absolute; inset:0; display:grid; place-items:center;
      animation: breathe 4s ease-in-out infinite;
    }
    @keyframes breathe{0%,100%{transform:translateY(0);} 50%{transform:translateY(3px);} }

    .blink{animation: blink 6s infinite;} 
    @keyframes blink{0%,94%,100%{transform:scaleY(1);} 96%{transform:scaleY(.1);} }

    .ear-wiggle{animation: earWiggle 8s ease-in-out infinite;} 
    @keyframes earWiggle{0%,92%,100%{transform:rotate(0deg);} 95%{transform:rotate(8deg);} }

    .particles{position:absolute; inset:0; pointer-events:none; display:grid; place-items:center; font-size:18px;} 

    .actions{position:sticky; bottom:0; display:grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap:8px; padding:10px; background:rgba(20,15,31,.75); border:1px solid rgba(255,255,255,.1); border-radius:20px; backdrop-filter: blur(10px);} 
    .action-btn{border:1px solid rgba(255,255,255,.18); border-radius:16px; background:rgba(255,255,255,.08); color:var(--text); padding:8px 6px; font-size:12px; display:grid; gap:4px; place-items:center; cursor:pointer; min-height:56px;} 
    .action-btn:disabled{opacity:.4; cursor:not-allowed;} 

    .footer{display:flex; justify-content:space-between; align-items:center; gap:10px;} 
    .btn{border:0; cursor:pointer; padding:10px 14px; border-radius:14px; color:var(--text); background: linear-gradient(135deg, var(--accent), var(--accent2)); font-weight:700; letter-spacing:.2px; display:inline-flex; align-items:center; gap:8px; box-shadow:0 10px 30px rgba(255,214,231,.2); transition: transform .12s var(--ease);} 
    .btn.secondary{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); box-shadow:none;} 
    .btn.ghost{background:transparent; border:1px solid rgba(255,255,255,.16); box-shadow:none;} 
    .btn:active{transform:translateY(1px) scale(.98)}

    .overlay{position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.6); backdrop-filter: blur(10px); z-index:50; padding:16px;} 
    .overlay.show{display:grid;} 
    .overlay-card{max-width:420px; padding:20px; border-radius:24px; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.5); text-align:center;} 

    .history{max-height:140px; overflow:auto; display:grid; gap:6px; font-size:12px; color:var(--muted);} 

    .toggle{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted);} 

    @media (prefers-reduced-motion: reduce){
      .pet{animation:none;}
      .blink, .ear-wiggle{animation:none;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">
        <div class="logo">🐑</div>
        <div>
          <h1>Luna das Lamm</h1>
          <p>Kümmer dich täglich um Luna</p>
        </div>
      </div>
      <button class="btn ghost" id="backBtn" aria-label="Zurück">← Hub</button>
    </div>

    <div class="info">
      <div class="pill-row">
        <div class="pill" id="lastSeen">Zuletzt geöffnet: —</div>
        <div class="pill" id="streak">Streak: 0 Tage (Best: 0)</div>
      </div>
    </div>

    <div class="card">
      <div class="stats" id="stats"></div>
    </div>

    <div class="pet-area">
      <div class="pet-stage">
        <svg class="pet" id="petSvg" viewBox="0 0 300 400" aria-label="Luna">
          <defs>
            <radialGradient id="wool" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#fff6fb" />
              <stop offset="100%" stop-color="#f4dcea" />
            </radialGradient>
          </defs>
          <ellipse cx="150" cy="210" rx="90" ry="80" fill="url(#wool)" />
          <ellipse cx="150" cy="240" rx="70" ry="60" fill="#f9e8f2" />
          <circle cx="115" cy="190" r="8" fill="#3b2f3d" class="blink" />
          <circle cx="185" cy="190" r="8" fill="#3b2f3d" class="blink" />
          <circle cx="112" cy="187" r="3" fill="#fff" />
          <circle cx="182" cy="187" r="3" fill="#fff" />
          <path d="M135 220 Q150 235 165 220" stroke="#3b2f3d" stroke-width="6" stroke-linecap="round" fill="none" />
          <circle cx="110" cy="215" r="6" fill="#ffb9d2" opacity=".7" />
          <circle cx="190" cy="215" r="6" fill="#ffb9d2" opacity=".7" />
          <path class="ear-wiggle" d="M70 170 Q60 140 90 130" stroke="#f2c6dc" stroke-width="16" stroke-linecap="round" fill="none" />
          <path class="ear-wiggle" d="M230 170 Q240 140 210 130" stroke="#f2c6dc" stroke-width="16" stroke-linecap="round" fill="none" />
          <g id="outfit" style="display:none;">
            <path d="M140 255 Q150 270 160 255" fill="#ff7bb1" />
            <circle cx="150" cy="258" r="6" fill="#ff9ec8" />
          </g>
        </svg>
        <div class="particles" id="particles"></div>
      </div>
    </div>

    <div class="card">
      <div class="toggle">
        <input type="checkbox" id="outfitToggle" />
        <label for="outfitToggle">🎀 Outfit an/aus</label>
      </div>
      <div class="history" id="history"></div>
    </div>

    <div class="actions" id="actions"></div>
  </div>

  <div class="overlay" id="dailyOverlay">
    <div class="overlay-card">
      <h2>Neuer Tag mit Luna 🌙</h2>
      <p id="dailyText">Streak: 0</p>
      <button class="btn" id="dailyClose">Okay</button>
    </div>
  </div>

  <div class="overlay" id="secretNote">
    <div class="overlay-card">
      <h2>Secret Note 💌</h2>
      <p>Fia, unser kleines Wir lebt hier drin. 🐑🤍<br/>— Dein Collin</p>
      <button class="btn" id="secretClose">Danke</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "luna_state_v1";
    const now = () => Date.now();
    const formatDateKey = (date) => {
      const d = new Date(date);
      const tzOffset = d.getTimezoneOffset() * 60000;
      const local = new Date(d.getTime() - tzOffset);
      return local.toISOString().slice(0, 10);
    };

    const defaultState = () => ({
      version: 1,
      petName: "Luna",
      createdAt: now(),
      lastOpenedAt: now(),
      stats: { hunger: 72, love: 65, energy: 55, fun: 40, clean: 80 },
      lastActions: { feedAt: 0, petAt: 0, sleepAt: 0, playAt: 0, cleanAt: 0 },
      daily: {
        dateKey: formatDateKey(now()),
        actionsDone: { feed: 0, pet: 0, sleep: 0, play: 0, clean: 0 },
        maxPerDay: { feed: 3, pet: 6, sleep: 2, play: 4, clean: 2 },
        streak: 0,
        bestStreak: 0
      },
      history: [],
      unlocks: { levelsUnlocked: [], outfitOn: false, uniqueDays: [] }
    });

    const loadState = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        return JSON.parse(raw);
      } catch {
        return defaultState();
      }
    };

    const saveState = (state) => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    };

    const state = loadState();

    const statsEl = document.getElementById("stats");
    const historyEl = document.getElementById("history");
    const streakEl = document.getElementById("streak");
    const lastSeenEl = document.getElementById("lastSeen");
    const particles = document.getElementById("particles");
    const outfitToggle = document.getElementById("outfitToggle");
    const outfit = document.getElementById("outfit");
    const dailyOverlay = document.getElementById("dailyOverlay");
    const dailyText = document.getElementById("dailyText");
    const secretNote = document.getElementById("secretNote");

    const actionsConfig = {
      feed: { label: "🍎 Füttern", delta: { hunger: 14, love: 2, clean: -1 }, note: "🍎 Apfel" },
      pet: { label: "🤍 Streicheln", delta: { love: 10, fun: 2 }, note: "🤍 Streicheln" },
      sleep: { label: "😴 Schlafen", delta: { energy: 18, hunger: -3 }, note: "😴 Schlaf" },
      play: { label: "🧸 Spielen", delta: { fun: 14, hunger: -4, energy: -3, love: 2 }, note: "🧸 Spielzeit" },
      clean: { label: "🧼 Sauber", delta: { clean: 16, love: 1 }, note: "🧼 Sauber" }
    };

    const clamp = (value) => Math.max(0, Math.min(100, Math.round(value)));

    function applyDecay(){
      const dtHours = Math.max(0, (now() - state.lastOpenedAt) / 3600000);
      if (!dtHours) return;
      state.stats.hunger = clamp(state.stats.hunger - 4 * dtHours);
      state.stats.energy = clamp(state.stats.energy - 3 * dtHours);
      state.stats.fun = clamp(state.stats.fun - 2.5 * dtHours);
      state.stats.clean = clamp(state.stats.clean - 2 * dtHours);
      state.stats.love = clamp(state.stats.love - 1.2 * dtHours);
    }

    function checkDailyReset(){
      const todayKey = formatDateKey(now());
      if (state.daily.dateKey !== todayKey){
        const goodDay = state.daily.actionsDone.feed >= 1 && state.daily.actionsDone.pet >= 1;
        state.daily.streak = goodDay ? state.daily.streak + 1 : 0;
        state.daily.bestStreak = Math.max(state.daily.bestStreak, state.daily.streak);
        state.daily.actionsDone = { feed: 0, pet: 0, sleep: 0, play: 0, clean: 0 };
        state.daily.dateKey = todayKey;
        dailyText.textContent = `Streak: ${state.daily.streak}`;
        dailyOverlay.classList.add("show");
      }
      if (!state.unlocks.uniqueDays.includes(todayKey)){
        state.unlocks.uniqueDays.push(todayKey);
      }
    }

    function mood(){
      const { hunger, love, energy, fun, clean } = state.stats;
      if (love < 25) return "sad";
      if (clean < 30) return "dirty";
      if (hunger < 30) return "hungry";
      if (energy < 30) return "sleepy";
      if (fun < 25) return "bored";
      if (hunger > 60 && love > 60 && energy > 50 && fun > 45 && clean > 45) return "happy";
      return "idle";
    }

    function renderStats(){
      statsEl.innerHTML = "";
      const entries = [
        { key: "hunger", label: "Hunger" },
        { key: "love", label: "Liebe" },
        { key: "energy", label: "Energie" },
        { key: "fun", label: "Spaß" },
        { key: "clean", label: "Sauber" }
      ];
      entries.forEach((entry) => {
        const row = document.createElement("div");
        row.className = "stat";
        row.innerHTML = `
          <span>${entry.label}</span>
          <div class="bar"><span style="width:${state.stats[entry.key]}%"></span></div>
          <span>${state.stats[entry.key]}</span>
        `;
        statsEl.appendChild(row);
      });
      streakEl.textContent = `Streak: ${state.daily.streak} Tage (Best: ${state.daily.bestStreak})`;
      lastSeenEl.textContent = `Zuletzt geöffnet: ${new Date(state.lastOpenedAt).toLocaleString("de-DE")}`;
    }

    function renderHistory(){
      historyEl.innerHTML = "";
      const recent = state.history.slice(-15).reverse();
      recent.forEach((entry) => {
        const line = document.createElement("div");
        line.textContent = `${new Date(entry.ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} · ${entry.note}`;
        historyEl.appendChild(line);
      });
    }

    function renderActions(){
      const container = document.getElementById("actions");
      container.innerHTML = "";
      Object.keys(actionsConfig).forEach((key) => {
        const config = actionsConfig[key];
        const btn = document.createElement("button");
        const done = state.daily.actionsDone[key];
        const max = state.daily.maxPerDay[key];
        btn.className = "action-btn";
        btn.innerHTML = `<div>${config.label}</div><div>${done}/${max}</div>`;
        if (done >= max) btn.disabled = true;
        btn.addEventListener("click", () => performAction(key));
        container.appendChild(btn);
      });
    }

    function logAction(type, delta, note){
      state.history.push({ ts: now(), type, delta, note });
      if (state.history.length > 120) state.history.shift();
    }

    function performAction(type){
      const config = actionsConfig[type];
      if (state.daily.actionsDone[type] >= state.daily.maxPerDay[type]) return;
      Object.keys(config.delta).forEach((stat) => {
        state.stats[stat] = clamp(state.stats[stat] + config.delta[stat]);
      });
      state.daily.actionsDone[type] += 1;
      state.lastActions[`${type}At`] = now();
      logAction(type, config.delta, config.note);
      saveState(state);
      renderStats();
      renderActions();
      renderHistory();
      triggerParticles(type);
      checkUnlocks();
    }

    function triggerParticles(type){
      const map = { feed: "🍎", pet: "🤍", sleep: "💤", play: "✨", clean: "🧼" };
      particles.textContent = map[type] || "✨";
      particles.style.opacity = "1";
      setTimeout(() => { particles.style.opacity = "0"; }, 800);
    }

    function checkUnlocks(){
      const levelSet = new Set(state.unlocks.levelsUnlocked);
      if (state.daily.actionsDone.feed >= 1 && !levelSet.has(1)) unlockLevel(1);
      if (state.daily.streak >= 3 && !levelSet.has(2)) unlockLevel(2);
      if (mood() === "happy"){
        state.unlocks.happyTicks = (state.unlocks.happyTicks || 0) + 1;
      } else {
        state.unlocks.happyTicks = 0;
      }
      if (state.unlocks.happyTicks >= 10 && !levelSet.has(3)) unlockLevel(3);
      const routine = state.daily.actionsDone.feed >= 1 && state.daily.actionsDone.pet >= 1 && state.daily.actionsDone.play >= 1 && state.daily.actionsDone.clean >= 1;
      if (routine && !levelSet.has(4)) unlockLevel(4);
      const totalActions = state.history.length;
      if ((state.daily.bestStreak >= 5 || totalActions >= 60) && !levelSet.has(5)) unlockLevel(5);
      if ((state.daily.bestStreak >= 10 || state.unlocks.uniqueDays.length >= 14) && !levelSet.has(6)) {
        unlockLevel(6);
        secretNote.classList.add("show");
      }
    }

    function unlockLevel(level){
      state.unlocks.levelsUnlocked.push(level);
      state.unlocks.levelsUnlocked = Array.from(new Set(state.unlocks.levelsUnlocked));
      saveState(state);
      syncHub(level);
      if (level === 5) {
        state.unlocks.outfitOn = true;
        outfitToggle.checked = true;
        outfit.style.display = "block";
      }
    }

    function syncHub(level){
      try {
        if (window.parent && window.parent.HUB_REWARDS) {
          window.parent.HUB_REWARDS.setProgress("luna", state.unlocks.levelsUnlocked.length, 6);
          window.parent.HUB_REWARDS.unlockByLevel("luna", level);
        }
      } catch (err) {
        // Ignore missing hub.
      }
    }

    function applyOutfit(){
      outfit.style.display = state.unlocks.outfitOn ? "block" : "none";
    }

    function handleBack(){
      try {
        if (window.parent && window.parent.document) {
          const closeBtn = window.parent.document.getElementById("closeApp");
          if (closeBtn) { closeBtn.click(); return; }
        }
      } catch (err) {
        // Ignore cross-origin.
      }
      if (window.history.length > 1){
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    }

    document.getElementById("backBtn").addEventListener("click", handleBack);
    document.getElementById("dailyClose").addEventListener("click", () => dailyOverlay.classList.remove("show"));
    document.getElementById("secretClose").addEventListener("click", () => secretNote.classList.remove("show"));

    outfitToggle.addEventListener("change", () => {
      state.unlocks.outfitOn = outfitToggle.checked;
      applyOutfit();
      saveState(state);
    });

    function init(){
      applyDecay();
      checkDailyReset();
      state.lastOpenedAt = now();
      saveState(state);
      renderStats();
      renderActions();
      renderHistory();
      applyOutfit();
      outfitToggle.checked = state.unlocks.outfitOn;
    }

    init();
    setInterval(() => {
      checkDailyReset();
      checkUnlocks();
    }, 60000);
  </script>
</body>
</html>
